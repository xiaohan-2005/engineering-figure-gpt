name: Skill CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m compileall scripts
      - name: Validate skill package
        run: python scripts/validate_skill.py .
      - name: Validate UTF-8 and mojibake
        run: python scripts/validate_text_encoding.py SKILL.md README.md README.en.md README.zh-CN.md agents assets references scripts schemas templates tests
      - name: Validate Chinese prompt templates
        run: python scripts/validate_prompt_templates.py .
      - name: Run tests
        run: python -m pytest -q
      - name: Validate pruned runtime package
        run: python scripts/check_runtime_package.py --token-budget 43000
      - name: Offline CLI smoke check
        run: python scripts/efg.py check
