interface:
  display_name: "Engineering Figure GPT"
  short_description: "GPT-native research figures with constrained editing, visual QA, exact plots, and modeling diagrams."
  default_prompt: "Use $engineering-figure-gpt to choose image, edit, plot, or mixed mode. For conceptual images, inject the publication image-quality contract and verify readability, clipping, arrows, labels, and scientific fidelity before final use. For existing images, choose the narrowest preservation-first edit mode: correct, revise, restyle, or redraw. Keep exact quantitative geometry and formulas local/deterministic, reuse the active Codex/CC Switch provider when appropriate, and verify explicit raster-size/format requirements on the returned artifact."

policy:
  allow_implicit_invocation: true
